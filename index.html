<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diagnostico de Resolucion DOOH</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { background: #050505; color: #fff; font-family: Consolas, 'Courier New', monospace; }
    .panel { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(8px, 1.5vmin, 32px); padding: 5vmin; text-align: center; }
    .label { font-size: clamp(20px, 2.4vmin, 48px); color: #a9a9a9; text-transform: uppercase; letter-spacing: .08em; }
    .main { font-weight: bold; color: #00ff63; font-size: clamp(30px, 8vmin, 170px); line-height: 1.05; }
    .grid { width: 100%; max-width: 1600px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(7px, 1.4vmin, 22px); }
    .cell { padding: clamp(10px, 1.5vmin, 24px); background: #171717; border: 1px solid #404040; border-radius: 12px; min-width: 0; overflow-wrap: anywhere; }
    .value { color: #00ff05; margin-top: .35em; font-size: clamp(15px, 2.8vmin, 52px); font-weight: bold;  }
    .message { color: #ffdc6e; font-size: clamp(13px, 2.1vmin, 42px); max-width: 1600px; line-height: 1.3; }
    .arrow { position: absolute; top: 1.4vmin; left: 50%; transform: translateX(-50%); color: #ff5656; font-size: clamp(14px, 2.2vmin, 46px); font-weight: bold; white-space: nowrap; }
    .corner { position: absolute; font-size: clamp(12px, 1.65vmin, 35px); color: #69b5ff; font-weight: bold; }
    .tl { top: 1.2vmin; left: 1.2vmin; } .tr { top: 1.2vmin; right: 1.2vmin; }
    .bl { bottom: 1.2vmin; left: 1.2vmin; } .br { bottom: 1.2vmin; right: 1.2vmin; }
    @media (max-aspect-ratio: 3/4) { .grid { grid-template-columns: 1fr; } .panel { gap: 1.1vmin; } .cell { padding: 1.2vmin; } }
  </style>
</head>
<body>
  <div class="corner tl">SUP. IZQ.</div><div class="corner tr">SUP. DER.</div>
  <div class="corner bl">INF. IZQ.</div><div class="corner br">INF. DER.</div>
  <div class="arrow">&#8593; ARRIBA DEL HTML</div>
  <main class="panel">
    <div class="label">Resolucion del area HTML</div>
    <div class="main" id="viewport">Detectando...</div>
    <div class="grid">
      <div class="cell"><div class="label">Orientacion del HTML</div><div class="value" id="viewportOrientation">-</div></div>
      <div class="cell"><div class="label">Screen reportado</div><div class="value" id="screenDimensions">-</div></div>
      <div class="cell"><div class="label">API Screen Orientation</div><div class="value" id="screenOrientation">-</div></div>
      <div class="cell"><div class="label">Rotacion CSS html / body</div><div class="value" id="cssRotation">-</div></div>
      <div class="cell"><div class="label">Pixel ratio</div><div class="value" id="pixelRatio">-</div></div>
      <div class="cell"><div class="label">Visual viewport</div><div class="value" id="visualViewport">-</div></div>
    </div>
    <div class="message" id="interpretation">Comprobando...</div>
  </main>
  <script>
    function orientation(w, h) { return w > h ? 'HORIZONTAL' : h > w ? 'VERTICAL' : 'CUADRADA'; }
    function cssTransformInfo(element) {
      const transform = getComputedStyle(element).transform;
      if (!transform || transform === 'none') return 'sin transformacion';
      // La matriz CSS informa sobre la transformacion del elemento, no sobre giros externos del reproductor.
      try {
        const matrix = new DOMMatrixReadOnly(transform);
        const deg = Math.round(Math.atan2(matrix.b, matrix.a) * 180 / Math.PI);
        return deg + '\u00b0 (CSS)';
      } catch (e) { return transform; }
    }
    function show() {
      const w = window.innerWidth, h = window.innerHeight;
      const sw = window.screen.width, sh = window.screen.height;
      const screenOrientation = window.screen.orientation;
      const hasOrientationAPI = Boolean(screenOrientation && typeof screenOrientation.angle === 'number');
      document.getElementById('viewport').textContent = w + ' \u00d7 ' + h;
      document.getElementById('viewportOrientation').textContent = orientation(w, h);
      document.getElementById('screenDimensions').textContent = sw + ' \u00d7 ' + sh + ' (' + orientation(sw, sh) + ')';
      document.getElementById('screenOrientation').textContent = hasOrientationAPI
        ? screenOrientation.type + ' / ' + screenOrientation.angle + '\u00b0'
        : 'No disponible';
      const htmlCss = cssTransformInfo(document.documentElement);
      const bodyCss = cssTransformInfo(document.body);
      document.getElementById('cssRotation').textContent = 'html: ' + htmlCss + ' | body: ' + bodyCss;
      document.getElementById('pixelRatio').textContent = String(window.devicePixelRatio || 1);
      const vv = window.visualViewport;
      document.getElementById('visualViewport').textContent = vv
        ? Math.round(vv.width) + ' \u00d7 ' + Math.round(vv.height) + ' / zoom ' + vv.scale
        : 'No disponible';
      const discrepancy = orientation(w, h) !== orientation(sw, sh);
      const cssFound = htmlCss !== 'sin transformacion' || bodyCss !== 'sin transformacion';
      let message = discrepancy
        ? 'AVISO: el area HTML y screen reportan orientaciones distintas. Revisar configuracion del reproductor.'
        : 'El area HTML y screen reportan la misma orientacion.';
      if (cssFound) message += ' Hay una transformacion CSS detectable en html o body.';
      message += ' Si la flecha roja NO apunta hacia arriba fisicamente, existe rotacion posterior al renderizado o transformacion no detectada aqui.';
      document.getElementById('interpretation').textContent = message;
    }
    window.addEventListener('load', show);
    window.addEventListener('resize', show);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', show);
    if (window.screen.orientation && window.screen.orientation.addEventListener) window.screen.orientation.addEventListener('change', show);
    setInterval(show, 2000);
  </script>
</body>
</html>
